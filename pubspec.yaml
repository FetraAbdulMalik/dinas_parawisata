name: guriang_garut
description: Aplikasi panduan wisata dan budaya Garut (Dinas Pariwisata).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  flutter_tts: ^4.0.2
  video_player: ^2.8.6
  sqflite_common_ffi_web: ^1.1.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  supabase_flutter: ^2.18.3
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  web: ^1.1.1
  pointer_interceptor: ^0.10.1+3
  image_picker: ^1.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/stories/
    - assets/video/
